<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Rediseño conceptual de una landing page inspirada en Porsche, desarrollado con HTML, CSS y JavaScript."
  >
  <title>Porsche Concept Landing Page</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/responsive.css">

</head>

<body>
  <header>
    <div class="container">

    <a href="#" class="header__brand">
      <img src="assets/logos/porsche-wordmark.svg" alt="Porsche">
    </a>

      <nav class="header__nav">

        <ul>

        <li><a href="#">Modelos</a></li>

        <li><a href="#">Servicios</a></li>

        <li><a href="#">Experiencias</a></li>

        <li><a href="#">Contacto</a></li>

    </ul>
    
      </nav>

    </div>
  </header>

  <main>
    <section class="hero">

      <div class="hero__media">
        <img
        src="./assets/images/hero/hero-desktop.avif" alt="Porsche GT3 vista trasera">
      </div>

      <div class="container">

        <div class="hero__content">
          <p class="hero__eyebrow">PORSCHE . ICONIC BY DESIGN</p>

          <h1 class="hero__title">There is no substitute.</h1>

          <p class="hero__description">
          Perfomance without compromise.
        </p>

        <a href="#" class="hero__cta">Explorar modelos</a>
      </div>

      </div>
    </section>

    <section class="models" id="modelos">
        
        <div class="container">
            <p class="models__eyebrow">
                Porsche
            </p>

            <h2 class="models__title">
                Explore our models.
            </h2>

            <p class="models__description">
              Discover a range designed around performance,
              precision and everyday driving.
            </p>

            <div class="models__grid">

              <article class="model-card">

                <div class="model-card__media">
                  <img src="" alt="">
                </div>

                <h3 class="model-card__title">
                  Porsche 911
                </h3>
              </article>

              <article class="model-card">
                
                <div class="model-card__media">
                  <img src="" alt="">
                </div>

                <h3 class="model-card__title">
                  Porsche 718
                </h3>
              </article>
            </div>
        </div>

    </section>

  </main>

  <footer>
  </footer>

    <script src="./js/data.js" defer></script>
    <script src="./js/main.js" defer></script>
</body>
</html>
